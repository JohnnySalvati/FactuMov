# nginx de FactuMov: sirve la SPA y proxea /api al backend.
#
# Este archivo se copia a /etc/nginx/conf.d/default.conf, que la imagen incluye adentro de
# `http {}`. Por eso los `limit_req_zone` y el `map` de acá arriba son válidos: son
# directivas de contexto http.
#
# Está adelante del backend y detrás de srv-nginx (192.168.100.9), que termina el HTTPS.
# Cadena completa:  navegador -> srv-nginx (443) -> VM:8001 -> este nginx -> app:8000

# --- Los dos techos de tráfico ---
# El limitador en memoria de la app es un piso por proceso, no un techo (CLAUDE.md ->
# *Rate limiting*). El techo va acá. Los dos números están muy por encima de los de la app,
# a propósito: el que tiene que contestar 429 con un mensaje entendible es el backend, que
# sabe limitar por dirección de email. Esto solo corta la inundación.
limit_req_zone $binary_remote_addr zone=factumov_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=factumov_auth:10m rate=20r/m;
# 429 y no el 503 que nginx contesta por default: es el mismo status que usa la app, así
# que el cliente no tiene que distinguir quién de los dos lo frenó.
limit_req_status 429;

# El esquema original. srv-nginx lo manda; si algún día alguien le pega directo a la VM,
# el fallback es la verdad de esa conexión y no una mentira cómoda.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Quién es el cliente de verdad ---
    # Sin esto, $remote_addr es srv-nginx y **todos los usuarios comparten un solo cubo**
    # del limitador de arriba. Con realip, nginx recorre el X-Forwarded-For de derecha a
    # izquierda salteando lo que confía, así que un cliente que se invente su propio
    # X-Forwarded-For no puede correr la cuenta a otro: su valor queda a la izquierda del
    # que agregó srv-nginx, y la búsqueda para antes de llegar.
    #
    # Si esta lista se desactualiza el síntoma es silencioso —vuelven a compartir cubo—,
    # así que después de un deploy conviene mirar el access log y ver una IP de cliente.
    set_real_ip_from 192.168.100.9;   # srv-nginx
    set_real_ip_from 172.16.0.0/12;   # la red interna del compose
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # El techo real de subida, que es el pendiente que dejó anotado el endpoint de
    # importación: `MAX_UPLOAD_BYTES` acota lo que el proceso copia y parsea, no lo que el
    # server ingiere. Va un poco arriba de esos 10 MiB para que el que conteste el caso
    # normal sea la app, con su 413 y su mensaje en castellano; esto frena al que manda un
    # gigabyte.
    client_max_body_size 12m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # --- Lo que ve el backend ---
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Un solo valor y sobrescrito, no `$proxy_add_x_forwarded_for`: acá arriba ya se
    # resolvió quién es el cliente, y uvicorn (--forwarded-allow-ips="*") se queda con el
    # primero de la lista. Reenviar la lista entera sería devolverle la decisión.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # Emitir es WSAA + FECompUltimoAutorizado + FECAESolicitar, y ARCA tarda. Con los 60 s
    # de default, un pedido de CAE lento se corta acá **después** de que ARCA autorizó: la
    # factura existe para el fisco y el usuario ve un 504.
    proxy_read_timeout 180s;

    # Y **conectar** no es lo mismo que **esperar la respuesta**. `app` está en la misma red
    # de Docker: abrir el socket sale en milisegundos o no sale, porque el contenedor no está
    # escuchando. Con el default de 60 s, cada `up -d --build` deja una ventana en la que
    # nginx no puede conectarse y cada pedido se queda un minuto colgado antes de rendirse —
    # y el usuario ve "Cargando…" en todas las pantallas sin ninguna pista de por qué.
    # Observado el 2026-08-28, justo después de un deploy. Bajarlo no acorta la ventana: la
    # vuelve honesta, con un 502 inmediato que la SPA ya sabe mostrar como error.
    proxy_connect_timeout 3s;

    # Docker le cambia la IP al contenedor `app` en cada `up -d --build`. Sin resolver,
    # nginx la resuelve una vez al arrancar y se la guarda para siempre: el primer deploy
    # que recree solo el backend deja esto contestando 502 hasta que alguien lo reinicie.
    # Con la IP detrás de una variable, la resuelve por request contra el DNS de Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://app:8000;

    # --- Los cinco endpoints que hay que cuidar ---
    # Van con su propio cubo, mucho más apretado, porque son los que mandan mail o queman
    # argon2. `/auth/me` queda afuera a propósito: lo llama el AuthProvider en cada carga
    # de página, así que meterlo acá castigaría al que recarga.
    location ~ ^/api/auth/(login|register|resend-confirmation|forgot-password|reset-password)$ {
        limit_req zone=factumov_auth burst=10 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $backend;
    }

    location /api/ {
        limit_req zone=factumov_api burst=40 nodelay;
        # El backend no conoce el prefijo: sus rutas son /auth/login, /customers, /invoices.
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $backend;
    }

    # --- La SPA ---
    # Los nombres traen el hash del contenido, así que un archivo nunca cambia de
    # contenido sin cambiar de nombre: se puede cachear para siempre.
    location /assets/ {
        # Un solo Cache-Control y no el `expires 1y` de manual, que agrega el suyo aparte y
        # deja dos renglones del mismo header en la respuesta.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # El que nombra a esos archivos, en cambio, no se puede cachear ni un minuto: si el
    # navegador se queda con el index viejo, pide los assets de la versión anterior y el
    # deploy no llega nunca.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # `/modelos/:id` y compañía son rutas de react-router: no existen como archivo, y sin
    # este fallback recargar adentro de la app da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
