services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: factumov
      POSTGRES_PASSWORD: factumov
      POSTGRES_DB: factumov
    # 5433 en el host: el 5432 ya lo ocupa Balance360.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
