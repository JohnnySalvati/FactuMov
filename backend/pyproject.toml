[project]
name = "factumov"
version = "0.1.0"
description = "Invoice template manager and e-invoicing app"
readme = "README.md"
authors = [
    { name = "MiguelSalvati", email = "miguelsalvati@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "pydantic>=2.0",
    "pydantic-settings",
    "python-multipart",
    "pdfplumber>=0.11.9",
    "pwdlib[argon2]>=0.3.1",
    "zeep>=4.3.3",
    "requests>=2.34.2",
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
    "ruff",
    "mypy",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
# Las migraciones las genera Alembic con su propio estilo; env.py sí se lintea.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]  # errores pycodestyle, pyflakes, isort

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
# tests/ no tiene __init__.py, así que por defecto mypy nombraría sus módulos por
# archivo ("conftest") y el override de abajo no engancharía. Con estas dos opciones
# el nombre se deriva de la raíz: "src" primero para que el paquete siga siendo
# factumov.*, y "." para que los tests sean tests.*.
mypy_path = "src:."
explicit_package_bases = true
# zeep trae `py.typed` pero deja sus constructores sin anotar, así que en modo strict cada
# `Client(...)` o `Transport(...)` es un "call to untyped function". Silenciar la regla solo
# para zeep es mejor que un `type: ignore` por línea en `services/arca.py`: los ignores se
# copian y sobreviven a la versión de zeep que los haya hecho falta.
untyped_calls_exclude = ["zeep"]

# Los tests quedan fuera de `strict`: anotar cada test con `-> None` y cada fixture
# con su Generator es ruido, no seguridad. El resto de strict sigue activo acá —
# solo se apagan las reglas que exigen anotaciones. src/ no cambia.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Sin esto, pytest solo agrega tests/ al sys.path y los helpers habría que importarlos como
# `import factories`. mypy, en cambio, los nombra tests.* (ver el override de arriba). Con la
# raíz en el path, `from tests import factories` funciona en los dos lados.
pythonpath = ["."]
